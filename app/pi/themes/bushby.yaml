# Bushby Smart Homes theme for Home Assistant (18 Nov 2026)
# Light and dark modes. Dark teal #08807C, light teal #4FD1C0 for highlights only, navy text #0B1F33, light background.
# Install: copy to /config/themes/bushby.yaml (configuration.yaml needs  frontend: themes: !include_dir_merge_named themes),
# then Developer tools > Actions > "Home Assistant Frontend: Reload themes", and pick Bushby in your profile.
Bushby:
  modes:
    light:
      primary-color: "#08807C"
      dark-primary-color: "#066663"
      light-primary-color: "#4FD1C0"
      accent-color: "#4FD1C0"
      primary-text-color: "#0B1F33"
      secondary-text-color: "#4A5B6B"
      disabled-text-color: "#9AA7B2"
      text-primary-color: "#FFFFFF"
      primary-background-color: "#FBFDFC"
      secondary-background-color: "#EEF5F4"
      card-background-color: "#FFFFFF"
      ha-card-border-color: "#DCE8E6"
      divider-color: "#DCE8E6"
      ha-card-border-radius: "14px"
      app-header-background-color: "#FBFDFC"
      app-header-text-color: "#0B1F33"
      app-header-border-bottom: "1px solid #DCE8E6"
      sidebar-background-color: "#FFFFFF"
      sidebar-text-color: "#0B1F33"
      sidebar-icon-color: "#4A5B6B"
      sidebar-selected-text-color: "#08807C"
      sidebar-selected-icon-color: "#08807C"
      state-icon-color: "#4A5B6B"
      state-active-color: "#08807C"
      state-light-on-color: "#E8A33D"
      switch-checked-color: "#08807C"
      switch-checked-button-color: "#08807C"
      switch-checked-track-color: "#4FD1C0"
      slider-color: "#08807C"
      paper-slider-knob-color: "#08807C"
      mdc-theme-primary: "#08807C"
      mdc-theme-secondary: "#4FD1C0"
      success-color: "#2E9E6A"
      warning-color: "#D98A1F"
      error-color: "#C8463D"
      info-color: "#08807C"
      code-editor-background-color: "#F4F8F7"
    dark:
      primary-color: "#4FD1C0"
      dark-primary-color: "#08807C"
      light-primary-color: "#8FE3D8"
      accent-color: "#4FD1C0"
      primary-text-color: "#E8F1F0"
      secondary-text-color: "#A9BAC6"
      disabled-text-color: "#6B7C8A"
      text-primary-color: "#0B1F33"
      primary-background-color: "#0B1F33"
      secondary-background-color: "#102A42"
      card-background-color: "#13304B"
      ha-card-border-color: "#1E4060"
      divider-color: "#1E4060"
      ha-card-border-radius: "14px"
      app-header-background-color: "#0B1F33"
      app-header-text-color: "#E8F1F0"
      app-header-border-bottom: "1px solid #1E4060"
      sidebar-background-color: "#0E2539"
      sidebar-text-color: "#E8F1F0"
      sidebar-icon-color: "#A9BAC6"
      sidebar-selected-text-color: "#4FD1C0"
      sidebar-selected-icon-color: "#4FD1C0"
      state-icon-color: "#A9BAC6"
      state-active-color: "#4FD1C0"
      state-light-on-color: "#F2B957"
      switch-checked-color: "#4FD1C0"
      switch-checked-button-color: "#4FD1C0"
      switch-checked-track-color: "#08807C"
      slider-color: "#4FD1C0"
      paper-slider-knob-color: "#4FD1C0"
      mdc-theme-primary: "#4FD1C0"
      mdc-theme-secondary: "#08807C"
      success-color: "#4CC38A"
      warning-color: "#F0A43A"
      error-color: "#F07167"
      info-color: "#4FD1C0"
      code-editor-background-color: "#0E2539"
